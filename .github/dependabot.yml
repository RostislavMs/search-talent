version: 2
updates:
  # Application dependencies. Grouped so related bumps land in one PR instead
  # of flooding the queue; majors stay separate so they get a deliberate review.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Vercel enforces a supply-chain `minimumReleaseAge` policy at install time
    # (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION). Without a cooldown, Dependabot
    # proposes same-day releases (e.g. @aws-sdk/* publishes daily) that are still
    # "too fresh" for the policy, so the Vercel build fails every rebase. A 7-day
    # cooldown keeps every proposed version comfortably past the policy window.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Majors are opt-in — review and bump these by hand.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Keep the GitHub Actions in ci.yml / codeql.yml on current majors.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
