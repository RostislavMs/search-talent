version: 2
updates:
  # Application dependencies. Grouped so related bumps land in one PR instead
  # of flooding the queue; majors stay separate so they get a deliberate review.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Majors are opt-in — review and bump these by hand.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Keep the GitHub Actions in ci.yml / codeql.yml on current majors.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
